name: BuildFerry CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: buildferry-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm audit --audit-level=high
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  container:
    name: Container startup and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: docker compose build
      - name: Verify a fresh install, restart and backup restore
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --wait --wait-timeout 90
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const result = await fetch('http://localhost:8787/api/session');
          const session = await result.json();
          assert.equal(session.stage, 'claim');
          assert.equal(session.demo, false);
          assert.equal(session.csrf, '');
          JS
          docker compose exec -T buildferry node dist/server/backup.js /data/smoke-backup.sqlite
          docker compose restart
          docker compose up -d --wait --wait-timeout 90
          docker compose exec -T buildferry node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { Store } from './dist/server/store.js';
          const restored = new Store('/data/smoke-backup.sqlite', readFileSync('/data/credentials.key'));
          assert.equal(typeof restored.db.prepare('SELECT 1 AS value').get().value, 'number');
          restored.close();
          assert.equal((await fetch('http://127.0.0.1:8787/readyz')).status, 200);
          JS
      - name: Stop containers
        if: always()
        run: docker compose down
