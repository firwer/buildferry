services:
  buildferry:
    build: .
    image: buildferry:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      BUILDFERRY_PUBLIC_URL: ${BUILDFERRY_PUBLIC_URL:-http://localhost:8787}
      BUILDFERRY_TRUST_PROXY_HOPS: ${BUILDFERRY_TRUST_PROXY_HOPS:-0}
      BUILDFERRY_ADMIN_USERNAME: ${BUILDFERRY_ADMIN_USERNAME:-}
      BUILDFERRY_ADMIN_PASSWORD: ${BUILDFERRY_ADMIN_PASSWORD:-}
    volumes:
      - buildferry-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

volumes:
  buildferry-data:
